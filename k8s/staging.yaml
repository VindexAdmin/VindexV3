# Vindex Chain - Kubernetes Staging Environment
# Staging configuration with reduced resources and test data

apiVersion: v1
kind: Namespace
metadata:
  name: vindex-staging
  labels:
    name: vindex-staging
    environment: staging

---
# ConfigMap for staging environment
apiVersion: v1
kind: ConfigMap
metadata:
  name: vindex-staging-config
  namespace: vindex-staging
data:
  NODE_ENV: "staging"
  BLOCKCHAIN_API_URL: "http://blockchain-core-service:3001"
  CORS_ORIGIN: "https://staging-wallet.vindex.io,https://staging-explorer.vindex.io,https://staging-admin.vindex.io"

---
# Secret for staging environment
apiVersion: v1
kind: Secret
metadata:
  name: vindex-staging-secrets
  namespace: vindex-staging
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXNxbDovL3ZpbmRleDp2aW5kZXhfc3RhZ2luZ0Bwb3N0Z3Jlcy1zdGFnaW5nOjU0MzIvdmluZGV4X3N0YWdpbmc=  # base64 encoded staging DB
  JWT_SECRET: c3RhZ2luZ19qd3Rfc2VjcmV0X2tleV8yMDI0  # base64 encoded staging secret
  NEXTAUTH_SECRET: c3RhZ2luZ19uZXh0YXV0aF9zZWNyZXRfMjAyNA==  # base64 encoded staging nextauth

---
# PostgreSQL for Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-staging
  namespace: vindex-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-staging
  template:
    metadata:
      labels:
        app: postgres-staging
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: vindex_staging
        - name: POSTGRES_USER
          value: vindex
        - name: POSTGRES_PASSWORD
          value: vindex_staging
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-staging-service
  namespace: vindex-staging
spec:
  selector:
    app: postgres-staging
  ports:
  - port: 5432
    targetPort: 5432

---
# Redis for Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-staging
  namespace: vindex-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-staging
  template:
    metadata:
      labels:
        app: redis-staging
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-staging-service
  namespace: vindex-staging
spec:
  selector:
    app: redis-staging
  ports:
  - port: 6379
    targetPort: 6379

---
# Blockchain Core Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-core
  namespace: vindex-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchain-core
  template:
    metadata:
      labels:
        app: blockchain-core
    spec:
      containers:
      - name: blockchain-core
        image: vindex/blockchain-core:latest
        env:
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vindex-staging-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-staging-secrets
              key: JWT_SECRET
        - name: REDIS_URL
          value: "redis://redis-staging-service:6379"
        envFrom:
        - configMapRef:
            name: vindex-staging-config
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-core-service
  namespace: vindex-staging
spec:
  selector:
    app: blockchain-core
  ports:
  - port: 3001
    targetPort: 3001

---
# Wallet App Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-app
  namespace: vindex-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-app
  template:
    metadata:
      labels:
        app: wallet-app
    spec:
      containers:
      - name: wallet-app
        image: vindex/wallet-app:latest
        env:
        - name: PORT
          value: "3000"
        - name: NEXTAUTH_URL
          value: "https://staging-wallet.vindex.io"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-staging-secrets
              key: NEXTAUTH_SECRET
        envFrom:
        - configMapRef:
            name: vindex-staging-config
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: wallet-app-service
  namespace: vindex-staging
spec:
  selector:
    app: wallet-app
  ports:
  - port: 3000
    targetPort: 3000

---
# Explorer Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explorer
  namespace: vindex-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: explorer
  template:
    metadata:
      labels:
        app: explorer
    spec:
      containers:
      - name: explorer
        image: vindex/explorer:latest
        env:
        - name: PORT
          value: "3001"
        - name: NEXTAUTH_URL
          value: "https://staging-explorer.vindex.io"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: vindex-staging-secrets
              key: NEXTAUTH_SECRET
        envFrom:
        - configMapRef:
            name: vindex-staging-config
        ports:
        - containerPort: 3001
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: explorer-service
  namespace: vindex-staging
spec:
  selector:
    app: explorer
  ports:
  - port: 3001
    targetPort: 3001

---
# Staging Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vindex-staging-ingress
  namespace: vindex-staging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - staging-wallet.vindex.io
    - staging-explorer.vindex.io
    - staging-admin.vindex.io
    - staging-api.vindex.io
    secretName: vindex-staging-tls
  rules:
  - host: staging-wallet.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wallet-app-service
            port:
              number: 3000
  - host: staging-explorer.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: explorer-service
            port:
              number: 3001
  - host: staging-api.vindex.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blockchain-core-service
            port:
              number: 3001
